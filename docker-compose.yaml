services:
  postgres:
    image: postgres:15
    container_name: gopay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gopaydb}
      POSTGRES_USER: ${DB_USER:-gopay}
      POSTGRES_PASSWORD: ${DB_PASS:-gopay}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - gopay-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gopay} -d ${DB_NAME:-gopaydb}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  gopay-postgres-data:
