spring:
  application:
    name: gopay

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gopaydb}
    username: ${DB_USER:}
    password: ${DB_PASS:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
